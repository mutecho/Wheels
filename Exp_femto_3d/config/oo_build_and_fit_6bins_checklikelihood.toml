log_level = "warn"

[build]
# map_pair_phi_to_symmetric_range = true
map_pair_phi_to_symmetric_range = false
write_normalized_se_me_1d_projections = false
reopen_output_file_per_slice = false
split_mixed_event_by_phi = true


[build.rebin.phi]
enabled = true
factor = 3

[build.rebin.mt]
enabled = true

[fit.parameters.alpha]
fixed_value = 2.0


[fit]
model = "full"
coulomb_mode = "finite_source"
# coulomb_mode = "none"|"gamow"|"finite_source"
finite_source_mode = "iterative_1d"
# finite_source_mode = "fixed_1d"|"iterative_1d"
use_core_halo_lambda = true
use_q2_baseline = true
use_pml = true
fit_q_max = 0.15
# omit to follow the input CF metadata written by build-cf
map_pair_phi_to_symmetric_range = false
# map_pair_phi_to_symmetric_range = true



# Optional serial PML profile-likelihood diagnostics. Disabled means the
# independent profile ROOT file is neither created nor reset.
[fit.profile_likelihood]
enabled = true
slice_scope = "fit_selection" # "listed" | "fit_selection"
# slice_ids = ["replace_with_exact_slice_id"] # forbidden for fit_selection
retry_strategy = "reference_and_bidirectional_neighbors"   # "reference_and_bidirectional_neighbors" | "reference_only"
write_likelihood_slice = true  # "true" | "Slice1D"
contour_levels = [1.0, 2.0, 4.0]

