# Based on oo_build_and_fit_6bins_shared_lambda_cuttest.toml.
# Preserve the loosecut05thres input, binning and fit selection.
# The inherited shared_lambda filename does not enable a free shared-phi lambda:
# CATS3D uses an external fixed lambda, common to phi slices in each group.

[input]
input_root = "/Users/allenzhou/ALICE/alidata/hyperloop_res/femtoep/OO/AnalysisResults_3d_25ae_pass2_loosecuttest.root"
task_name = "femto-dream-pair-task-track-track" # 05thres
same_event_subtask = "SameEvent_3Dqn"
mixed_event_subtask = "MixedEvent_3Dqn"
sparse_object_name = "relPair3dRmTMultPercentileQnPairphi"

[output]
output_directory = "/Users/allenzhou/ALICE/alidata/femtoep_res/OO"
cf_root_name = "EP_dependence_CF_3d_25ae_pass2_loosecut05thres_6phi_cats3d.root"
fit_root_name = "EP_dependence_CF_full_fit_v2_3d_25ae_pass2_nonfold_fcoul_loosecut05thres_6phi_shared_lambda_cats3d.root"
fit_summary_name = "3d_25ae_pass2_fit_summary_nonfold_fcoul_loosecut05thres_6phi_shared_lambda_cats3d.tsv"
fit_report_directory = "/Users/allenzhou/Research_software/Code_Base/Exp_femto_3d/res"
fit_report_root_name = "fit_report_3d_25ae_pass2_nonfold_fcoul_loosecut05thres_6phi_shared_lambda_cats3d.root"
log_level = "warn"

[build]
map_pair_phi_to_symmetric_range = false
write_normalized_se_me_1d_projections = false
reopen_output_file_per_slice = false
split_mixed_event_by_phi = true

[build.rebin.phi]
enabled = true
factor = 3

[build.rebin.mt]
enabled = true

[fit.parameters.alpha]
fixed_value = 2.0

[fit]
correlation_backend = "cats3d"
model = "full"
lambda_mode = "independent" # External fixed lambda; shared_phi is unsupported by CATS3D.
use_q2_baseline = true
use_pml = true
fit_q_max = 0.15
map_pair_phi_to_symmetric_range = false

[[bins.centrality]]
min = 0
max = 10

[[bins.centrality]]
min = 10
max = 30

[[bins.centrality]]
min = 30
max = 50

[[bins.centrality]]
min = 50
max = 80

[[bins.centrality]]
min = 80
max = 100

[[bins.mt]]
min = 0.2
max = 0.4

[[bins.mt]]
min = 0.4
max = 0.6

[[bins.mt]]
min = 0.6
max = 0.8

[[bins.mt]]
min = 0.8
max = 1.1

[[bins.mt]]
min = 1.1
max = 1.6

[[fit_selection.centrality]]
min = 0
max = 10

[[fit_selection.centrality]]
min = 10
max = 30

[[fit_selection.centrality]]
min = 30
max = 50

[[fit_selection.mt]]
min = 0.2
max = 0.4

[[fit_selection.mt]]
min = 0.4
max = 0.6

[[fit_selection.mt]]
min = 0.6
max = 0.8

[[fit_selection.mt]]
min = 0.8
max = 1.1

[[fit_selection.mt]]
min = 1.1
max = 1.6

[fit.cats3d]
with_coulomb = true
# Reference settings; verify grid precision before production use.
grid_bins = 31
grid_min_fm = -50.0
grid_max_fm = 50.0
subdivisions = 1
max_pw = 16
max_kernel_gib = 4.0
max_peak_gib = 8.0 # Estimated process peak budget for a 16 GiB machine.
use_disk_cache = true
kernel_cache_directory = "/Users/allenzhou/Research_software/Code_Base/Exp_femto_3d/build/cats3d_kernels"
# Optional load-only native CATS3D ByQ file; q/r grids and physics must match.
# kernel_cache_file = "/path/to/matching_CATS3DFastKernel6DByQ.root"

[fit.cats3d.lambda]
kind = "constant"
meaning = "final_lambda"
value = 0.7 # EXAMPLE ONLY: replace with calibrated external lambda.

[fit.cats3d.lambda_scan]
enabled = false
execution_mode = "alongside_fit"
root_name = "lambda_scan_oo_loosecut05thres_6phi_cats3d.root"
# Enable with explicit coordinates when needed:
# constant_values = [0.6, 0.7, 0.8]
