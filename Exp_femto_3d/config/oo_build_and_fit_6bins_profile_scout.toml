# Fast, diagnostic-only scout tier for the 2026-08-13 6-phi fit summary.
#
# Exact slice selection is deterministic: the nine rows with status != 3,
# their four group-level phi_all counterparts (deduplicated), and two successful
# phi_all controls spanning the low- and high-centrality endpoints.

[input]
input_root = "/Users/allenzhou/ALICE/alidata/hyperloop_res/femtoep/OO/AnalysisResults_3d_25ae_pass2_sel8.root"
task_name = "femto-dream-pair-task-track-track"
same_event_subtask = "SameEvent_3Dqn"
mixed_event_subtask = "MixedEvent_3Dqn"
sparse_object_name = "relPair3dRmTMultPercentileQnPairphi"

[output]
# The existing CF file is intentionally reused as fit input. All possible
# production outputs have unique names; profile_only must not create them.
output_directory = "/Users/allenzhou/ALICE/alidata/femtoep_res/OO"
cf_root_name = "EP_dependence_CF_3d_25ae_pass2_sel8_6phi.root"
fit_root_name = "EP_dependence_CF_full_fit_v2_3d_25ae_pass2_nonfold_fcoul_sel8_6phi_profile_scout_private.root"
fit_summary_name = "3d_25ae_pass2_fit_summary_nonfold_fcoul_sel8_6phi_profile_scout_private.tsv"
fit_report_directory = "/Users/allenzhou/Research_software/Code_base/Exp_femto_3d/res"
fit_report_root_name = "fit_report_3d_25ae_pass2_nonfold_fcoul_sel8_6phi_profile_scout_private.root"
profile_root_name = "profile_likelihood_oo_6phi_scout.root"
log_level = "warn"

[build]
map_pair_phi_to_symmetric_range = false
write_normalized_se_me_1d_projections = false
reopen_output_file_per_slice = false
split_mixed_event_by_phi = true

[build.rebin.phi]
enabled = true
factor = 3

[build.rebin.mt]
enabled = true

[fit.parameters.alpha]
fixed_value = 2.0

[fit]
model = "full"
coulomb_mode = "finite_source"
finite_source_mode = "iterative_1d"
use_core_halo_lambda = true
use_q2_baseline = true
use_pml = true
fit_q_max = 0.15
map_pair_phi_to_symmetric_range = false

[fit.profile_likelihood]
enabled = true
execution_mode = "profile_only"
parallel_backend = "process"
workers = 2
minimizer_backend = "legacy_tminuit"
hesse_strategy = "none"
slice_scope = "listed"
slice_ids = [
  # status != 3 rows from the 2026-08-13 TSV
  "cent_0.00-10.00__mtbin_0003__mt_1.10-1.60__phibin_0000__phi_0.26",
  "cent_10.00-30.00__mtbin_0003__mt_1.10-1.60__phi_all",
  "cent_10.00-30.00__mtbin_0003__mt_1.10-1.60__phibin_0000__phi_0.26",
  "cent_10.00-30.00__mtbin_0003__mt_1.10-1.60__phibin_0001__phi_0.79",
  "cent_10.00-30.00__mtbin_0003__mt_1.10-1.60__phibin_0004__phi_2.36",
  "cent_10.00-30.00__mtbin_0003__mt_1.10-1.60__phibin_0005__phi_2.88",
  "cent_30.00-50.00__mtbin_0002__mt_0.80-1.10__phibin_0004__phi_2.36",
  "cent_30.00-50.00__mtbin_0003__mt_1.10-1.60__phibin_0003__phi_1.83",
  "cent_30.00-50.00__mtbin_0003__mt_1.10-1.60__phibin_0005__phi_2.88",
  # Matching phi_all rows for groups not already represented by phi_all.
  "cent_0.00-10.00__mtbin_0003__mt_1.10-1.60__phi_all",
  "cent_30.00-50.00__mtbin_0002__mt_0.80-1.10__phi_all",
  "cent_30.00-50.00__mtbin_0003__mt_1.10-1.60__phi_all",
  # Deterministic successful controls: first low-/high-centrality phi_all groups.
  "cent_0.00-10.00__mtbin_0000__mt_0.40-0.60__phi_all",
  "cent_30.00-50.00__mtbin_0000__mt_0.40-0.60__phi_all",
]
retry_strategy = "reference_only"
write_likelihood_slice = false
contour_levels = [1.0, 2.0, 4.0]

[fit.profile_likelihood.checkpoint]
enabled = true
resume = true
run_id = "oo_6phi_scout_v1"
directory = "profile_likelihood_scout.work"

[[fit.profile_likelihood.scans]]
id = "norm"
parameters = ["norm"]
points = [11]
