[input]
input_root = "/absolute/path/to/AnalysisResults_3d.root"
task_name = "femto-dream-pair-task-track-track"
same_event_subtask = "SameEvent_3Dqn"
mixed_event_subtask = "MixedEvent_3Dqn"
sparse_object_name = "relPair3dRmTMultPercentileQnPairphi"

[output]
output_directory = "/absolute/path/to/output"
cf_root_name = "cf_output.root"
fit_root_name = "fit_output.root"
fit_summary_name = "fit_summary.tsv"
fit_report_directory = "/absolute/path/to/report-output"
fit_report_root_name = "fit_report.root"
profile_root_name = "profile_likelihood.root"
log_level = "info"

[build]
map_pair_phi_to_symmetric_range = false
write_normalized_se_me_1d_projections = false
reopen_output_file_per_slice = true
split_mixed_event_by_phi = false
# split_same_event_by_qn = true
# split_mixed_event_by_qn = true  # requires split_same_event_by_qn and [[bins.qn]]
progress = "auto"   # 也可写 true / false

[build.rebin.phi]
enabled = false

[build.rebin.mt]
enabled = true       # 使用下方 [[bins.mt]] 物理区间

[fit]
model = "full"
coulomb_mode = "gamow"
# legacy equivalent still accepted: use_coulomb = true
use_core_halo_lambda = true
use_q2_baseline = true
use_pml = true
fit_q_max = 0.15
# omit to follow the input CF metadata written by build-cf
# map_pair_phi_to_symmetric_range = false
reopen_output_file_per_slice = true
progress = "auto"   # 也可写 "enabled" / "disabled"

# Optional PML profile-likelihood diagnostics. Disabled means the
# independent profile ROOT file is neither created nor reset.
[fit.profile_likelihood]
enabled = false
execution_mode = "alongside_fit" # use "profile_only" with listed slices for diagnostics-only runs
parallel_backend = "serial"      # process requires profile_only + legacy_tminuit
workers = 1
minimizer_backend = "legacy_tminuit" # thread/minuit2 remains experimental and execution-gated
hesse_strategy = "all_attempts"  # "all_attempts" | "none"
slice_scope = "listed" # "listed" | "fit_selection"
slice_ids = ["replace_with_exact_slice_id"] # forbidden for fit_selection
retry_strategy = "reference_and_bidirectional_neighbors"   # "reference_and_bidirectional_neighbors" | "reference_only"
write_likelihood_slice = true
contour_levels = [1.0, 2.0, 4.0]

# [fit.profile_likelihood.checkpoint]
# enabled = true
# resume = true
# run_id = "scout_v1"
# directory = "profile_likelihood.work"

[[fit.profile_likelihood.scans]]
id = "rout2"
parameters = ["rout2"]
points = [41]
min = [0.01]
max = [100.0]
refine = true
refinement_points = [21]

[[fit.profile_likelihood.scans]]
id = "rout2_lambda"
parameters = ["rout2", "lambda"]
points = [21, 21]
refine = false

# Optional main Levy fit-parameter overrides. Omitted fields keep legacy defaults.
# [fit.parameters.lambda]
# initial = 0.5
# min = 0.0
# max = 1.0
# fixed_value = 0.65  # only lambda and alpha support fixed_value
#
# [fit.parameters.alpha]
# initial = 1.5
# min = 0.5
# max = 2.0

[[bins.centrality]]
min = 0.0
max = 10.0

[[bins.centrality]]
min = 10.0
max = 30.0

[[bins.mt]]
min = 0.24
max = 0.33

[[bins.mt]]
min = 0.42
max = 0.52

[[fit_selection.centrality]]
min = 0.0
max = 10.0

[[fit_selection.centrality]]
min = 10.0
max = 30.0

[[fit_selection.mt]]
min = 0.24
max = 0.33

[[fit_selection.mt]]
min = 0.42
max = 0.52
